
{% extends "base.html" %}

{% block title %}Editar médico{% endblock %}

{% block content %}

<h2>Editar médico</h2>

<form method="POST">

    <label for="nombre">Nombre:</label>
    <br>
    <input
        type="text"
        id="nombre"
        name="nombre"
        value="{{ medico.nombre }}"
        required
    >

    <br><br>

    <label for="especialidad_id">Especialidad:</label>
    <br>

    <select name="especialidad_id" id="especialidad_id" required>
        <option value="">Seleccione una especialidad</option>

        {% for especialidad in especialidades %}
            <option
                value="{{ especialidad.id }}"
                data-nombre="{{ especialidad.nombre }}"
                {% if medico.especialidad_id == especialidad.id %}
                    selected
                {% endif %}
            >
                {{ especialidad.nombre }}
            </option>
        {% endfor %}
    </select>

    <input
        type="hidden"
        name="especialidad"
        id="especialidad"
        value="{{ medico.especialidad }}"
    >

    <br><br>

    <label for="telefono">Teléfono:</label>
    <br>
    <input
        type="text"
        id="telefono"
        name="telefono"
        value="{{ medico.telefono or '' }}"
    >

    <br><br>

    <label for="correo">Correo:</label>
    <br>
    <input
        type="email"
        id="correo"
        name="correo"
        value="{{ medico.correo or '' }}"
    >

    <br><br>

    <button type="submit">Guardar cambios</button>

</form>

<br>

<a href="{{ url_for('medico.listar_medicos') }}">
    Volver al listado de médicos
</a>

<script>
    const especialidadSelect =
        document.getElementById("especialidad_id");

    const especialidadTexto =
        document.getElementById("especialidad");

    especialidadSelect.addEventListener("change", function () {
        const opcion = this.options[this.selectedIndex];

        especialidadTexto.value = opcion.dataset.nombre || "";
    });
</script>

{% endblock %}
