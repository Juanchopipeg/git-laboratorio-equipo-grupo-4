<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Especialidad</title>
</head>
<body>

    <h1>Editar Especialidad</h1>

    <form method="POST">

        <label>Nombre:</label>
        <br>
        <input
            type="text"
            name="nombre"
            value="{{ especialidad.nombre }}"
            required
        >

        <br><br>

        <label>Descripción:</label>
        <br>
        <textarea
            name="descripcion"
            rows="4"
            cols="40"
        >{{ especialidad.descripcion }}</textarea>

        <br><br>

        <button type="submit">
            Guardar Cambios
        </button>

    </form>

    <br>

    <a href="/especialidades">
        Volver a Especialidades
    </a>

</body>
</html>
