
{% extends "base.html" %}

{% block title %}Editar especialidad{% endblock %}

{% block content %}

<h2>Editar especialidad médica</h2>

<form method="POST">

    <label for="nombre">Nombre:</label>
    <br>
    <input
        type="text"
        id="nombre"
        name="nombre"
        value="{{ especialidad.nombre }}"
        required
    >

    <br><br>

    <label for="descripcion">Descripción:</label>
    <br>
    <textarea
        id="descripcion"
        name="descripcion"
        rows="4"
        cols="40"
    >{{ especialidad.descripcion or '' }}</textarea>

    <br><br>

    <button type="submit">Guardar cambios</button>

</form>

<br>

<a href="{{ url_for('especialidad.listar_especialidades') }}">
    Volver al listado de especialidades
</a>

{% endblock %}
