<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Cita</title>
</head>

<body>

    <h1>Editar Cita</h1>

    <form method="POST">

        <label>Fecha:</label>
        <br>

        <input
            type="date"
            name="fecha"
            value="{{ cita.fecha }}"
            required
        >

        <br><br>

        <label>Hora:</label>
        <br>

        <input
            type="time"
            name="hora"
            value="{{ cita.hora }}"
            required
        >

        <br><br>

        <label>Motivo:</label>
        <br>

        <textarea
            name="motivo"
            rows="4"
            cols="40"
        >{{ cita.motivo }}</textarea>

        <br><br>

        <label>Paciente:</label>
        <br>

        <select name="paciente_id" required>

            {% for paciente in pacientes %}

            <option
                value="{{ paciente.id }}"
                {% if paciente.id == cita.paciente_id %}
                    selected
                {% endif %}
            >

                {{ paciente.nombre }}
                {{ paciente.apellido }}

            </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Médico:</label>
        <br>

        <select name="medico_id" required>

            {% for medico in medicos %}

            <option
                value="{{ medico.id }}"
                {% if medico.id == cita.medico_id %}
                    selected
                {% endif %}
            >

                {{ medico.nombre }}
                - {{ medico.especialidad }}

            </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Guardar Cambios
        </button>

    </form>

    <br>

    <a href="/citas">
        Volver a Citas
    </a>

</body>

</html>
