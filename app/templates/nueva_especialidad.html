
{% extends "base.html" %}

{% block title %}Nueva especialidad{% endblock %}

{% block content %}

<h2>Registrar nueva especialidad médica</h2>

<form method="POST">

    <label for="nombre">Nombre:</label>
    <br>
    <input
        type="text"
        id="nombre"
        name="nombre"
        required
    >

    <br><br>

    <label for="descripcion">Descripción:</label>
    <br>
    <textarea
        id="descripcion"
        name="descripcion"
        rows="4"
        cols="40"
        placeholder="Escriba una descripción (opcional)"
    ></textarea>

    <br><br>

    <button type="submit">Guardar especialidad</button>

</form>

<br>

<a href="{{ url_for('especialidad.listar_especialidades') }}">
    Volver al listado de especialidades
</a>

{% endblock %}
