<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Médico</title>
</head>

<body>

    <h1>Registrar Nuevo Médico</h1>

    <form method="POST">

        <label>Nombre:</label>
        <br>
        <input
            type="text"
            name="nombre"
            required
        >

        <br><br>

        <label>Especialidad:</label>
        <br>

        <select name="especialidad_id" id="especialidad_id" required>

            <option value="">
                Seleccione una especialidad
            </option>

            {% for especialidad in especialidades %}

            <option
                value="{{ especialidad.id }}"
                data-nombre="{{ especialidad.nombre }}"
            >
                {{ especialidad.nombre }}
            </option>

            {% endfor %}

        </select>

        <input
            type="hidden"
            name="especialidad"
            id="especialidad"
        >

        <br><br>

        <label>Teléfono:</label>
        <br>
        <input
            type="text"
            name="telefono"
        >

        <br><br>

        <label>Correo:</label>
        <br>
        <input
            type="email"
            name="correo"
        >

        <br><br>

        <button type="submit">
            Guardar Médico
        </button>

    </form>

    <br>

    <a href="/medicos">
        Volver a Médicos
    </a>


    <script>

        const especialidadSelect =
            document.getElementById("especialidad_id");

        const especialidadTexto =
            document.getElementById("especialidad");

        especialidadSelect.addEventListener("change", function() {

            const opcion =
                this.options[this.selectedIndex];

            especialidadTexto.value =
                opcion.dataset.nombre || "";

        });

    </script>

</body>
</html>
