
{% extends "base.html" %}

{% block title %}Registrar nuevo médico{% endblock %}

{% block content %}

<h2>Registrar nuevo médico</h2>

<form method="POST">

    <p>
        <label for="nombre">Nombre:</label><br>
        <input
            type="text"
            id="nombre"
            name="nombre"
            required
        >
    </p>

    <p>
        <label for="especialidad_id">Especialidad:</label><br>

        <select name="especialidad_id" id="especialidad_id" required>
            <option value="">Seleccione una especialidad</option>

            {% for especialidad in especialidades %}
                <option
                    value="{{ especialidad.id }}"
                    data-nombre="{{ especialidad.nombre }}"
                >
                    {{ especialidad.nombre }}
                </option>
            {% endfor %}
        </select>
    </p>

    <input
        type="hidden"
        name="especialidad"
        id="especialidad"
    >

    <p>
        <label for="telefono">Teléfono:</label><br>
        <input
            type="text"
            id="telefono"
            name="telefono"
        >
    </p>

    <p>
        <label for="correo">Correo:</label><br>
        <input
            type="email"
            id="correo"
            name="correo"
        >
    </p>

    <button type="submit">Guardar médico</button>

</form>

<p>
    <a href="{{ url_for('medico.listar_medicos') }}">
        Volver al listado de médicos
    </a>
</p>

<script>
    const especialidadSelect =
        document.getElementById("especialidad_id");

    const especialidadTexto =
        document.getElementById("especialidad");

    especialidadSelect.addEventListener("change", function () {
        const opcion = this.options[this.selectedIndex];
        especialidadTexto.value = opcion.dataset.nombre || "";
    });
</script>

{% endblock %}
